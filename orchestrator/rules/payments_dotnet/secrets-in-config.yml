rules:
  - id: payments.dotnet.connection-string-with-password
    languages: [json]
    severity: WARNING
    message: >
      Connection string with embedded credentials in appsettings.json. Pulls
      DB credentials into source-control surface area. Use User Secrets in
      development and Azure Key Vault / environment variables in production;
      keep appsettings.json placeholders only.
    metadata:
      category: payments
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A05:2021 Security Misconfiguration"]
      pci: ["8.2.1"]
    patterns:
      - pattern-regex: '"[^"]*ConnectionString[^"]*"\s*:\s*"[^"]*(Password|Pwd)=[^"]+"'

  - id: payments.dotnet.api-key-in-appsettings
    languages: [json]
    severity: WARNING
    message: >
      An API key / token / secret literal appears in an appsettings.*.json
      file. Move to environment variables, User Secrets, or Key Vault. Anything
      checked in is rotation work + audit risk forever.
    metadata:
      category: payments
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A05:2021 Security Misconfiguration"]
    patterns:
      - pattern-regex: '"(ApiKey|Api_Key|SecretKey|Secret|ClientSecret|AccessToken|StripeKey|StripeSecret|PaymentApiKey)"\s*:\s*"[A-Za-z0-9_\-]{16,}"'
