rules:
  - id: payments.java.hardcoded-db-password
    languages: [generic]
    severity: WARNING
    message: >
      Hardcoded database password in Spring Boot properties file. Use
      environment-variable placeholders (${DB_PASSWORD}) and inject the real
      value from a secrets manager at deploy time. Anything committed to source
      control is audit risk and rotation work forever.
    metadata:
      category: payments
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A05:2021 Security Misconfiguration"]
      pci: ["8.2.1"]
    paths:
      include:
        - "application*.properties"
        - "application*.yml"
        - "application*.yaml"
        - "bootstrap*.properties"
        - "bootstrap*.yml"
    patterns:
      - pattern-regex: 'datasource\.password\s*[=:]\s*(?!\s*$)(?!\$\{)\S+'

  - id: payments.java.hardcoded-api-key-properties
    languages: [generic]
    severity: WARNING
    message: >
      API key, client secret, or payment provider credential literal in a
      Spring Boot properties file. Move the value to an environment variable
      or secrets manager and reference it with ${VAR_NAME}. Committed secrets
      cannot be truly rotated -- the git history retains them permanently.
    metadata:
      category: payments
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A05:2021 Security Misconfiguration"]
    paths:
      include:
        - "application*.properties"
        - "application*.yml"
        - "application*.yaml"
        - "bootstrap*.properties"
        - "bootstrap*.yml"
    patterns:
      - pattern-regex: '(?i)(api[._-]?key|secret[._-]?key|client[._-]?secret|payment[._-]?key|stripe[._-]?key|access[._-]?token)\s*[=:]\s*(?!\$\{)[A-Za-z0-9_\-]{16,}'
